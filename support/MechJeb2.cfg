//Tiers

@PART[*]:HAS[@MODULE[ModuleCommand]]:NEEDS[MechJeb2]:Final
{
	%MODULE[MechJebCore]
	{
		%MechJebLocalSettings
		{
			%MechJebModuleSmartASS { unlockTechs = start }
			%MechJebModuleCustomWindowEditor { unlockTechs = control1 }
			%MechJebModuleManeuverPlanner { unlockTechs = control2 }
			%MechJebModuleNodeEditor { unlockTechs = control2 }
			%MechJebModuleAscentGuidance { unlockTechs = control3 }
			%MechJebModuleAttitudeAdjustment { unlockTechs = control3 }
			%MechJebModuleThrustWindow { unlockTechs = control3 }
			%MechJebModuleRCSBalancerWindow { unlockTechs = control5 }
			%MechJebModuleLandingGuidance { unlockTechs = landing5 }
			%MechJebModuleWarpHelper { unlockTechs = probes5 }
			%MechJebModuleRendezvousGuidance { unlockTechs = control6 }
			%MechJebModuleSpaceplaneGuidance { unlockTechs = aerodynamics7 }
			%MechJebModuleRoverWindow { unlockTechs = robotics8 }
			%MechJebModuleDockingGuidance { unlockTechs = control9 }
			%MechJebModuleTranslatron { unlockTechs = control9 }
			%MechJebModuleRendezvousAutopilotWindow { unlockTechs = control9 }
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleCommand]]:NEEDS[KerbalEngineer]:Final
{
	MODULE
	{
		name = FlightEngineerModule
	}
}

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[kOSProcessor]]:NEEDS[kOS]:Final
{
	MODULE
	{
		name = kOSProcessor
		diskSpace = 8000
	}
}

